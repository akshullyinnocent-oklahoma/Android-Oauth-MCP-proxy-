    <title>OAuth MCP Proxy (Android)</title>
    <meta name="description" content="Connect remote OAuth-secured MCP servers, authenticate with OAuth 2.0 / PKCE, and expose a local proxy endpoint for Claude Desktop, Cursor, and Android client apps to access MCP tools." />
    <meta property="og:title" content="OAuth MCP Proxy (Android)" />
    <meta property="og:description" content="Connect remote OAuth-secured MCP servers, authenticate with OAuth 2.0 / PKCE, and expose a local proxy endpoint for Claude Desktop, Cursor, and Android client apps to access MCP tools." />

    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <!-- Suppress harmless Vite HMR WebSocket connection errors in iframe/Cloud Run environment -->
    <script>
      window.addEventListener('error', function(e) {
        if (e && (e.message && (e.message.indexOf('WebSocket') !== -1 || e.message.indexOf('@vite/client') !== -1))) {
          e.stopImmediatePropagation();
          e.preventDefault();
        }
      });
      window.addEventListener('unhandledrejection', function(e) {
        if (e && e.reason && String(e.reason).indexOf('WebSocket') !== -1) {
          e.stopImmediatePropagation();
          e.preventDefault();
        }
      });
    </script>
  </head>
  <body class="bg-slate-950 text-slate-100 antialiased selection:bg-cyan-500/30 selection:text-cyan-200 min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
